# 发版：编译成书 PDF，作为 GitHub Release 附件发布（PDF 不入库）。
#
# 触发方式
#   1. 全部分册一起发：推送 tag  v<版本>，例如 v0.0.1
#        git tag -a v0.0.1 -m "v0.0.1" ; git push origin v0.0.1
#      编译 books/ 下所有有 main.typ 的分册，同一个 Release 里附 <分册>-v<版本>.pdf 等文件。
#   2. 只发一册：推送 tag  <分册>-v<版本>，例如 physics-1-v0.1.0（分册名即 books/ 下的目录名）。
#   3. 手动运行（Actions → release → Run workflow）：填 tag，默认只生成草稿（draft），确认后再在 Release 页面发布。
#
# 发版前先在本机 `just check`，并确认各册 REVISIONS.md 与 common/TERMINOLOGY.md 已更新。

name: release

on:
  push:
    tags:
      - 'v[0-9]*'
      - '*-v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 版本号 tag，如 v0.0.1（全部分册）或 physics-1-v0.1.0（单册）
        required: true
        type: string
      draft:
        description: 只生成草稿，不公开
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      books: ${{ steps.meta.outputs.books }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析分册与版本
        id: meta
        shell: bash
        run: |
          if [[ "$TAG" =~ ^v[0-9] ]]; then
            version="${TAG#v}"
            books=$(for f in books/*/main.typ; do basename "$(dirname "$f")"; done | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read().split()))')
          else
            book="${TAG%-v*}"
            version="${TAG##*-v}"
            if [ ! -f "books/${book}/main.typ" ]; then
              echo "::error::tag ${TAG} 对应的分册 books/${book}/main.typ 不存在"
              exit 1
            fi
            books="[\"${book}\"]"
          fi
          echo "分册：${books}  版本：${version}"
          echo "books=${books}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        book: ${{ fromJSON(needs.plan.outputs.books) }}
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1

      - uses: extractions/setup-just@v2

      - name: 缓存字体
        id: fonts-cache
        uses: actions/cache@v4
        with:
          path: fonts
          key: fonts-${{ hashFiles('scripts/get-fonts.sh') }}

      - name: 下载开源字体
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: just fonts

      # Python 辅助脚本经 uv 运行，依赖按 pyproject.toml / uv.lock 安装（与本机 just 命令一致）
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # build/ 不入库，干净的 CI 机器上要先建；首次编译会下载 @preview 包，下载进度写在 stderr，
      # 会让下面“有输出就失败”的检查误报，所以先编译一遍把包下载好（这一遍只要求能编译）
      - name: 预下载 Typst 包
        shell: bash
        run: |
          mkdir -p build
          typst compile "books/${{ matrix.book }}/main.typ" build/warmup.pdf --root . --font-path fonts --ignore-system-fonts

      - name: 编译（有任何错误或警告就失败）
        run: just check ${{ matrix.book }}

      - name: 检查成书 PDF（页数、书签、可检索文本）
        shell: bash
        run: |
          uv run --locked python - <<'PY'
          import sys, pymupdf
          book = "${{ matrix.book }}"
          d = pymupdf.open(f"build/{book}.pdf")
          toc = d.get_toc()
          text = "".join(d[i].get_text() for i in range(min(10, len(d))))
          print("页数", len(d), "书签", len(toc), "前 10 页文字数", len(text))
          if len(d) < 100 or len(toc) < 15 or len(text) < 500:
              sys.exit("成书 PDF 检查未通过：页数、书签或文本层异常")
          PY

      - name: 整理发布文件
        shell: bash
        run: |
          book="${{ matrix.book }}"
          name="${book}-v${{ needs.plan.outputs.version }}"
          mkdir -p dist
          cp "build/${book}.pdf" "dist/${name}.pdf"
          cp "books/${book}/REVISIONS.md" "dist/${name}-REVISIONS.md"
          (cd dist && sha256sum "${name}.pdf" > "${name}.pdf.sha256")
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.book }}
          path: dist/
          if-no-files-found: error

  release:
    # 所有分册都编译通过才发布（任何一册失败就不发）
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: 汇总
        shell: bash
        run: ls -l dist

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' }}
          body_path: .github/release-notes.md
          generate_release_notes: false
          files: dist/*
